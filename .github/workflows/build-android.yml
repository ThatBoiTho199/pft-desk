name: Build Android APK (debug, untested)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - run: npm install
      - run: npm run tauri icon app-icon.png
      - run: npm run tauri android init
      - run: npm run tauri android build -- --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: pft-desk-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
